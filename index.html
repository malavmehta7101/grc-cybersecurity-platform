<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRC Cybersecurity Platform</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --tp:#1A1917;--ts:#5F5E5A;--tt:#888780;
  --bp:#FFFFFF;--bs:#F5F3EE;
  --bd3:#E2E0DA;--bd2:#D0CEC7;--bd1:#B4B2A9;
  --td:#A32D2D;--bd:#FCEBEB;
  --tw:#854F0B;--bw:#FAEEDA;
  --ti:#185FA5;--bi:#E3EEFB;
  --tg:#0F6E56;--bg:#E1F5EE;
  --fs:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --fm:'SF Mono','Fira Code',monospace;
  --r4:4px;--r6:6px;--r8:8px;
}
@media(prefers-color-scheme:dark){:root{
  --tp:#E8E6E0;--ts:#B4B2A9;--tt:#888780;
  --bp:#1C1B19;--bs:#252320;
  --bd3:#333130;--bd2:#3D3C39;--bd1:#5F5E5A;
  --td:#F48771;--bd:#3D1A1A;
  --tw:#F0B862;--bw:#3D2C12;
  --ti:#7BB3F0;--bi:#1B2E4D;
  --tg:#6BC88A;--bg:#1B3826;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fs);background:var(--bp);color:var(--tp);line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
header{border-bottom:0.5px solid var(--bd3);padding-bottom:1rem;margin-bottom:1.5rem}
.header-top{display:flex;align-items:center;gap:.75rem;margin-bottom:.25rem}
.header-top h1{font-size:18px;font-weight:500;color:var(--tp)}
.header-top span{font-size:11px;background:var(--bi);color:var(--ti);padding:2px 8px;border-radius:var(--r4);font-weight:500}
header p{font-size:12px;color:var(--ts)}
.tab-nav{display:flex;gap:2px;border-bottom:0.5px solid var(--bd3);margin-bottom:1.5rem;flex-wrap:wrap}
.tab-btn{padding:8px 14px;font-size:13px;color:var(--ts);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;display:flex;align-items:center;gap:6px}
.tab-btn.on{color:var(--tp);font-weight:500;border-bottom-color:var(--tp)}
.tab-btn:hover:not(.on){color:var(--tp)}
.panel{display:none}.panel.on{display:block}
.sub-nav{display:flex;gap:4px;margin-bottom:1.25rem;flex-wrap:wrap}
.sub-btn{padding:5px 12px;font-size:12px;border:0.5px solid var(--bd2);border-radius:var(--r6);background:transparent;cursor:pointer;color:var(--ts)}
.sub-btn.on{background:var(--bs);color:var(--tp);font-weight:500;border-color:var(--bd1)}
.sub-btn:hover:not(.on){background:var(--bs)}
.sub-panel{display:none}.sub-panel.on{display:block}
.sec-title{font-size:15px;font-weight:500;color:var(--tp);margin-bottom:3px}
.sec-sub{font-size:12px;color:var(--ts);margin-bottom:1.25rem}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:600px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{background:var(--bs);border-radius:var(--r6);padding:.875rem}
.mlb{font-size:11px;color:var(--ts);margin-bottom:4px}
.mvl{font-size:22px;font-weight:500;color:var(--tp)}
.mvl.cr{color:var(--td)}.mvl.hi{color:var(--tw)}.mvl.ok{color:var(--tg)}.mvl.in{color:var(--ti)}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--r4);font-size:11px;font-weight:500}
.b-c{background:var(--bd);color:var(--td)}.b-h{background:var(--bw);color:var(--tw)}
.b-m{background:var(--bi);color:var(--ti)}.b-l{background:var(--bg);color:var(--tg)}
.b-ok{background:var(--bg);color:var(--tg)}.b-pt{background:var(--bw);color:var(--tw)}
.b-nc{background:var(--bd);color:var(--td)}.b-na{background:var(--bs);color:var(--ts)}
.b-pl{background:var(--bi);color:var(--ti)}.b-ni{background:var(--bd);color:var(--td)}
.b-mit{background:var(--bi);color:var(--ti)}.b-tr{background:var(--bw);color:var(--tw)}
.b-ac{background:var(--bs);color:var(--ts)}.b-on{background:var(--bg);color:var(--tg)}
.b-ar{background:var(--bw);color:var(--tw)}.b-of{background:var(--bd);color:var(--td)}
.b-risk{background:var(--bi);color:var(--ti)}.b-audit{background:var(--bw);color:var(--tw)}
.b-both{background:var(--bd);color:var(--td)}
.frow{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.frow span{font-size:12px;color:var(--ts)}
.fbtn{padding:4px 12px;font-size:12px;border:0.5px solid var(--bd2);border-radius:var(--r6);background:transparent;cursor:pointer;color:var(--ts)}
.fbtn.on{background:var(--bs);color:var(--tp);font-weight:500;border-color:var(--bd1)}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:11px;font-weight:500;color:var(--ts);text-align:left;padding:7px 8px;border-bottom:0.5px solid var(--bd3);white-space:nowrap}
td{padding:7px 8px;border-bottom:0.5px solid var(--bd3);color:var(--tp);vertical-align:top}
tr:last-child td{border-bottom:none}
.ptrack{background:var(--bs);border-radius:3px;overflow:hidden}
.pfill{border-radius:3px;transition:width .5s}
.matrix{display:inline-grid;grid-template-columns:28px repeat(5,48px);gap:2px}
.mc{height:44px;border-radius:var(--r4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.ml{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tt)}
.mc-l{background:var(--bg);color:var(--tg)}.mc-m{background:var(--bi);color:var(--ti)}
.mc-h{background:var(--bw);color:var(--tw)}.mc-c{background:var(--bd);color:var(--td)}
.axl{font-size:10px;color:var(--tt);text-align:center}
.mwrap{display:flex;gap:2rem;align-items:flex-start;margin-bottom:1.5rem;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;padding-top:2.5rem}
.li{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ts)}
.ls{width:13px;height:13px;border-radius:3px}
.dom{border:0.5px solid var(--bd3);border-radius:var(--r8);margin-bottom:9px;overflow:hidden}
.dhdr{padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--bp)}
.dhdr:hover{background:var(--bs)}
.dname{font-size:13px;font-weight:500;color:var(--tp);flex:1}
.dpg{display:flex;align-items:center;gap:8px}
.dpbar{width:56px;background:var(--bs);border-radius:3px;height:5px;overflow:hidden}
.dpfil{height:100%;border-radius:3px}
.dppct{font-size:11px;color:var(--ts);min-width:28px;text-align:right}
.dbody{display:none;border-top:0.5px solid var(--bd3)}.dbody.open{display:block}
.ctrl{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-bottom:0.5px solid var(--bd3)}
.ctrl:last-child{border-bottom:none}
.cid{font-size:10px;color:var(--tt);min-width:52px;padding-top:2px;font-family:var(--fm)}
.cname{font-size:12px;color:var(--tp);flex:1;line-height:1.5}
.cfind{font-size:11px;color:var(--ts);margin-top:2px;line-height:1.4}
.cstat{min-width:110px;text-align:right}
.orgrow{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.orgrow label{font-size:13px;color:var(--ts)}
.orgrow select{font-size:13px;padding:5px 10px;border-radius:var(--r6);border:0.5px solid var(--bd2);background:var(--bp);color:var(--tp);cursor:pointer}
.swrap{margin-bottom:1.5rem}
.shdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.spct{font-size:26px;font-weight:500}
.cgrid{display:grid;grid-template-columns:2fr 1fr;gap:1.25rem;margin-bottom:1.5rem;align-items:start}
@media(max-width:700px){.cgrid{grid-template-columns:1fr}}
.cbox{border:0.5px solid var(--bd3);border-radius:var(--r8);padding:1rem}
.ct{font-size:13px;font-weight:500;color:var(--tp);margin-bottom:.5rem}
.cleg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:.625rem}
.cli{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ts)}
.csq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.snav{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.sdots{display:flex;gap:4px;align-items:center}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--bd2);cursor:pointer}
.sdot.on{background:var(--tp);width:8px;height:8px}
.sbtns{display:flex;gap:8px}
.sbtn{padding:5px 14px;font-size:13px;border:0.5px solid var(--bd2);border-radius:var(--r6);background:transparent;cursor:pointer;color:var(--ts)}
.sbtn:hover:not(:disabled){background:var(--bs);color:var(--tp)}
.sbtn:disabled{opacity:.35;cursor:default}
.sarea{border:0.5px solid var(--bd3);border-radius:var(--r8);padding:1.75rem;background:var(--bp);min-height:380px}
.stag{font-size:10px;color:var(--tt);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.625rem}
.stitle{font-size:20px;font-weight:500;color:var(--tp);margin-bottom:.75rem;line-height:1.3}
.sbody{font-size:13px;color:var(--ts);line-height:1.7}
.pol-card{border:0.5px solid var(--bd3);border-radius:var(--r8);margin-bottom:10px;overflow:hidden}
.pol-hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bp)}
.pol-hdr:hover{background:var(--bs)}
.pol-name{font-size:13px;font-weight:500;color:var(--tp);flex:1}
.pol-body{display:none;border-top:0.5px solid var(--bd3);padding:1rem 1.25rem}.pol-body.open{display:block}
.pol-section{margin-bottom:.875rem}.pol-section:last-child{margin-bottom:0}
.pol-label{font-size:10px;font-weight:500;color:var(--ts);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.375rem}
.pol-text{font-size:12px;color:var(--tp);line-height:1.65}
.pol-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.pol-list li{font-size:12px;color:var(--tp);line-height:1.55;display:flex;gap:8px}
.pol-list li::before{content:'→';color:var(--tt);flex-shrink:0}
.raci-tbl{width:100%;border-collapse:collapse;font-size:11px}
.raci-tbl th{padding:7px 6px;text-align:center;font-weight:500;font-size:10px;color:var(--ts);border-bottom:0.5px solid var(--bd3)}
.raci-tbl th:first-child{text-align:left}
.raci-tbl td{padding:7px 6px;border-bottom:0.5px solid var(--bd3);text-align:center;font-size:11px}
.raci-tbl td:first-child{text-align:left;color:var(--tp)}
.raci-tbl tr:last-child td{border-bottom:none}
.rr{color:var(--td);font-weight:500}.ra{color:var(--tw);font-weight:500}
.rc{color:var(--ti);font-weight:500}.ri{color:var(--ts)}
.rq{margin-bottom:14px}
.rqlabel{font-size:11px;font-weight:500;color:var(--ts);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.rqbar{flex:1;height:0.5px;background:var(--bd3)}
.rqitems{display:flex;flex-wrap:wrap;gap:5px}
.rqi{padding:3px 10px;border-radius:var(--r6);font-size:11px}
.rqi-1{background:var(--bd);color:var(--td)}.rqi-2{background:var(--bw);color:var(--tw)}
.rqi-3{background:var(--bi);color:var(--ti)}.rqi-4{background:var(--bg);color:var(--tg)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.kpi-card{border:0.5px solid var(--bd3);border-radius:var(--r8);padding:1rem}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.5rem}
.kpi-val{font-size:22px;font-weight:500;color:var(--tp)}
.kpi-name{font-size:12px;color:var(--ts);line-height:1.4;margin-bottom:.375rem}
.kpi-target{font-size:11px;color:var(--tt);margin-bottom:.5rem}
.sev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem}
.sev-card{border:0.5px solid var(--bd3);border-radius:var(--r6);padding:11px}
.sev-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sev-row{font-size:11px;color:var(--ts);line-height:1.5;margin-bottom:3px}
.sev-row strong{color:var(--tp);font-weight:500}
.phases{display:flex;margin-bottom:1.5rem;overflow-x:auto}
.phase{flex:1;min-width:90px;border:0.5px solid var(--bd3);padding:10px 8px;text-align:center;border-right:none}
.phase:last-child{border-right:0.5px solid var(--bd3)}
.phase:first-child{border-radius:var(--r6) 0 0 var(--r6)}.phase:last-child{border-radius:0 var(--r6) var(--r6) 0}
.phase-num{width:22px;height:22px;border-radius:50%;background:var(--bs);font-size:11px;font-weight:500;color:var(--ts);display:flex;align-items:center;justify-content:center;margin:0 auto 5px}
.phase-name{font-size:11px;font-weight:500;color:var(--tp);margin-bottom:3px}
.phase-time{font-size:10px;color:var(--tt)}
.scen{border:0.5px solid var(--bd3);border-radius:var(--r8);margin-bottom:9px;overflow:hidden}
.scen-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bp)}
.scen-hdr:hover{background:var(--bs)}
.scen-title{font-size:13px;font-weight:500;color:var(--tp);flex:1}
.scen-body{display:none;border-top:0.5px solid var(--bd3);padding:1rem 1.25rem}.scen-body.open{display:block}
.scen-label{font-size:10px;font-weight:500;color:var(--ts);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.375rem;margin-top:.75rem}
.scen-steps{list-style:none;display:flex;flex-direction:column;gap:4px}
.scen-steps li{font-size:12px;color:var(--tp);line-height:1.5;display:flex;gap:8px}
.scen-steps li::before{content:'→';color:var(--tt);flex-shrink:0}
.vra-score-box{border:0.5px solid var(--bd3);border-radius:var(--r8);padding:1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.vra-score-val{font-size:36px;font-weight:500;color:var(--tp)}
.vra-cat{font-size:10px;font-weight:500;color:var(--ts);padding:10px 0 6px;border-bottom:0.5px solid var(--bd3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.vra-row{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:0.5px solid var(--bd3)}
.vra-row:last-child{border-bottom:none}
.vra-q{font-size:12px;color:var(--tp);flex:1;line-height:1.5;padding-top:3px}
.vra-btns{display:flex;gap:4px;flex-shrink:0}
.vra-btn{padding:3px 9px;font-size:11px;border:0.5px solid var(--bd2);border-radius:var(--r6);background:transparent;cursor:pointer;color:var(--ts);white-space:nowrap}
.vra-btn.yes-on{background:var(--bg);color:var(--tg);border-color:var(--tg)}
.vra-btn.part-on{background:var(--bw);color:var(--tw);border-color:var(--tw)}
.vra-btn.no-on{background:var(--bd);color:var(--td);border-color:var(--td)}
.vra-btn.na-on{background:var(--bs);color:var(--tp);border-color:var(--bd1)}
.rpt-section{border:0.5px solid var(--bd3);border-radius:var(--r8);padding:1.25rem;margin-bottom:1rem}
.rpt-h{font-size:13px;font-weight:500;color:var(--tp);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.rpt-p{font-size:12px;color:var(--ts);line-height:1.7;margin-bottom:.625rem}
.rpt-p:last-child{margin-bottom:0}
.find-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.find-list li{font-size:12px;color:var(--tp);line-height:1.5;display:flex;gap:8px}
.find-list li::before{content:'•';color:var(--tt);flex-shrink:0}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.75rem}
.hm-lbl{font-size:10px;color:var(--ts);text-align:center;padding:4px 2px}
.hm-cell{padding:6px 4px;border-radius:var(--r4);font-size:11px;font-weight:500;text-align:center}
.hm-ok{background:var(--bg);color:var(--tg)}.hm-pt{background:var(--bw);color:var(--tw)}.hm-ni{background:var(--bd);color:var(--td)}
.rpt-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:.875rem}
.rpt-mk{font-size:10px;color:var(--tt);margin-bottom:2px}
.rpt-mv{font-size:12px;font-weight:500;color:var(--tp)}
.rec-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:0.5px solid var(--bd3);border-radius:var(--r6);margin-bottom:6px}
.rec-item:last-child{margin-bottom:0}
.actions-list{display:flex;flex-direction:column;gap:7px}
.action-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:0.5px solid var(--bd3);border-radius:var(--r6)}
.action-num{width:20px;height:20px;border-radius:50%;background:var(--bd);color:var(--td);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.action-meta{font-size:11px;color:var(--ts);margin-top:2px}
.tc-active{display:inline-block;background:var(--bi);color:var(--ti);border-radius:3px;padding:2px 8px;font-size:10px;font-weight:500}
.tc-q{display:inline-block;background:var(--bw);color:var(--tw);border-radius:3px;padding:2px 8px;font-size:10px;font-weight:500}
.tc-empty{display:inline-block;width:20px;height:4px;border-radius:2px;background:var(--bs)}
footer{border-top:0.5px solid var(--bd3);padding-top:1rem;margin-top:2rem;font-size:11px;color:var(--tt);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="header-top">
    <h1>🛡️ GRC Cybersecurity Platform</h1>
    <span>v1.0 — 2025</span>
  </div>
  <p>Governance · Risk Management · Compliance — ISO 27001 · NIST CSF · SP 800-61r2 · 15 interactive modules</p>
</header>

<nav class="tab-nav">
  <button class="tab-btn on" onclick="switchTab('risk',this)"><i class="ti ti-shield-exclamation"></i> Risk</button>
  <button class="tab-btn" onclick="switchTab('audit',this)"><i class="ti ti-clipboard-check"></i> Compliance</button>
  <button class="tab-btn" onclick="switchTab('gov',this)"><i class="ti ti-building-community"></i> Governance</button>
  <button class="tab-btn" onclick="switchTab('analytics',this)"><i class="ti ti-chart-bar"></i> Analytics</button>
  <button class="tab-btn" onclick="switchTab('ops',this)"><i class="ti ti-siren"></i> Operations</button>
  <button class="tab-btn" onclick="switchTab('report',this)"><i class="ti ti-report-analytics"></i> Audit Report</button>
</nav>

<!-- RISK PANEL -->
<div id="panel-risk" class="panel on">
  <div class="sub-nav">
    <button class="sub-btn on" onclick="switchSub('risk','reg',this)">Risk register</button>
    <button class="sub-btn" onclick="switchSub('risk','treat',this)">Treatment register</button>
  </div>
  <div id="sub-risk-reg" class="sub-panel on"></div>
  <div id="sub-risk-treat" class="sub-panel"></div>
</div>

<!-- COMPLIANCE PANEL -->
<div id="panel-audit" class="panel">
  <div class="sub-nav">
    <button class="sub-btn on" onclick="switchSub('audit','main',this)">ISO 27001 audit</button>
    <button class="sub-btn" onclick="switchSub('audit','ext',this)">Extended domains</button>
    <button class="sub-btn" onclick="switchSub('audit','soa',this)">Statement of applicability</button>
    <button class="sub-btn" onclick="switchSub('audit','gap',this)">Gap analysis</button>
  </div>
  <div id="sub-audit-main" class="sub-panel on"></div>
  <div id="sub-audit-ext" class="sub-panel"></div>
  <div id="sub-audit-soa" class="sub-panel"></div>
  <div id="sub-audit-gap" class="sub-panel"></div>
</div>

<!-- GOVERNANCE PANEL -->
<div id="panel-gov" class="panel">
  <div class="sub-nav">
    <button class="sub-btn on" onclick="switchSub('gov','slides',this)">Strategy presentation</button>
    <button class="sub-btn" onclick="switchSub('gov','policy',this)">Policy templates</button>
  </div>
  <div id="sub-gov-slides" class="sub-panel on"></div>
  <div id="sub-gov-policy" class="sub-panel"></div>
</div>

<!-- ANALYTICS PANEL -->
<div id="panel-analytics" class="panel">
  <div class="sub-nav">
    <button class="sub-btn on" onclick="switchSub('analytics','dash',this)">Executive dashboard</button>

function renderSoA(){
  const totalCtrl=ALL_DOMS.reduce((a,d)=>a+d.controls.length,0);
  const key=ok(soaOrg);const findKey=fk(soaOrg);
  const imp=ALL_DOMS.reduce((a,d)=>a+d.controls.filter(c=>c[key]==='compliant').length,0);
  const part=ALL_DOMS.reduce((a,d)=>a+d.controls.filter(c=>c[key]==='partial').length,0);
  const ni=ALL_DOMS.reduce((a,d)=>a+d.controls.filter(c=>c[key]==='non-compliant').length,0);
  let t=0,s=0;ALL_DOMS.forEach(d=>d.controls.forEach(c=>{const v=c[key];if(v&&v!=='na'){t++;s+=(v==='compliant'?1:v==='partial'?.5:0)}}));
  const score=t?Math.round((s/t)*100):0;const fc=pfc(score);
  const domHTML=ALL_DOMS.map(d=>{
    const p=domPct(d,soaOrg);const isOpen=soaOpen.has(d.id);
    const ctrlHTML=d.controls.map(c=>{
      const v=c[key];
      const status=v==='compliant'?'implemented':v==='non-compliant'?'not-implemented':v==='partial'?'partial':'not-implemented';
      if(soaFilter!=='all'&&status!==soaFilter)return'';
      return`<div class="ctrl"><div class="cid">${c.id}</div><div style="flex:1"><div class="cname">${c.name}</div><div class="cfind">${c[findKey]||''}</div></div><div class="cstat">${stbadge(status)}</div></div>`;
    }).join('');
    if(!ctrlHTML.trim())return'';
    return`<div class="dom"><div class="dhdr" onclick="toggleSoA('${d.id}')"><div class="dname">${d.id} — ${d.name}</div><div class="dpg"><div class="dpbar"><div class="dpfil" style="width:${p}%;background:${pfc(p)}"></div></div><div class="dppct">${p}%</div><i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:13px;color:var(--ts)"></i></div></div><div class="dbody${isOpen?' open':''}">${ctrlHTML}</div></div>`;
  }).join('');
  document.getElementById('sub-audit-soa').innerHTML=`<div class="sec-title">Statement of applicability (SoA)</div><div class="sec-sub">ISO/IEC 27001:2013 — all 14 Annex A domains, ${totalCtrl} controls — mandatory document for ISMS certification</div><div class="orgrow"><label>Organization:</label><select onchange="switchSoAOrg(this.value)"><option value="techcorp"${soaOrg==='techcorp'?' selected':''}>TechCorp Ltd</option><option value="health"${soaOrg==='health'?' selected':''}>HealthFirst Inc</option></select></div><div class="mgrid"><div class="mcard"><div class="mlb">Implemented</div><div class="mvl ok">${imp}</div></div><div class="mcard"><div class="mlb">Partial</div><div class="mvl hi">${part}</div></div><div class="mcard"><div class="mlb">Not implemented</div><div class="mvl cr">${ni}</div></div><div class="mcard"><div class="mlb">SoA score</div><div class="mvl" style="color:${fc}">${score}%</div></div></div><div class="frow"><span>Filter:</span>${[['all','All controls'],['implemented','Implemented'],['partial','Partial'],['not-implemented','Not implemented']].map(([v,l])=>`<button class="fbtn${soaFilter===v?' on':''}" onclick="setSoAFilter('${v}')">${l}</button>`).join('')}</div>${domHTML}`;
}

  const sorted=[...RISKS].map(r=>({...r,score:r.l*r.i,level:rl(r.l*r.i)})).sort((a,b)=>b.score-a.score);
  const rows=sorted.map(r=>`<tr><td style="font-weight:500">${r.threat}</td><td style="text-align:center;font-weight:500">${r.score}</td><td><span class="badge ${bc(r.level)}">${bl(r.level)}</span></td><td style="min-width:120px"><div style="background:var(--bs);border-radius:3px;height:8px;overflow:hidden"><div style="width:${Math.round((r.score/25)*100)}%;height:100%;border-radius:3px;background:${colMap[r.level]}"></div></div></td></tr>`).join('');
  document.getElementById('sub-analytics-charts').innerHTML=`<div class="sec-title">Risk analytics</div><div class="sec-sub">Visual breakdown of the 12-item risk register — scores, distribution, and category exposure</div><div class="mgrid"><div class="mcard"><div class="mlb">Total risks</div><div class="mvl">12</div></div><div class="mcard"><div class="mlb">Critical</div><div class="mvl cr">2</div></div><div class="mcard"><div class="mlb">High</div><div class="mvl hi">7</div></div><div class="mcard"><div class="mlb">Medium</div><div class="mvl in">3</div></div></div><div class="cgrid"><div class="cbox"><div class="ct">Risk score by threat (sorted)</div><div class="cleg"><span class="cli"><span class="csq" style="background:#E24B4A"></span>Critical (≥15)</span><span class="cli"><span class="csq" style="background:#BA7517"></span>High (10–14)</span><span class="cli"><span class="csq" style="background:#378ADD"></span>Medium (6–9)</span></div><div style="position:relative;height:480px"><canvas id="risk-bar-chart" aria-label="Horizontal bar chart: 12 threats sorted by risk score descending"></canvas></div></div><div class="cbox"><div class="ct">Risk level breakdown</div><div class="cleg" style="flex-direction:column;gap:5px"><span class="cli"><span class="csq" style="background:#E24B4A"></span>Critical — 2 risks</span><span class="cli"><span class="csq" style="background:#BA7517"></span>High — 7 risks</span><span class="cli"><span class="csq" style="background:#378ADD"></span>Medium — 3 risks</span><span class="cli"><span class="csq" style="background:#1D9E75"></span>Low — 0 risks</span></div><div style="position:relative;height:240px"><canvas id="risk-donut-chart" aria-label="Donut chart risk levels"></canvas></div><div class="twrap" style="margin-top:1rem"><table><thead><tr><th>Threat</th><th style="text-align:center">Score</th><th>Level</th><th>Exposure</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
  setTimeout(()=>{
    const tc=isDark()?'#B4B2A9':'#888780',gc=isDark()?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.06)';
    if(chartBar)chartBar.destroy();if(chartDonut)chartDonut.destroy();
    const rbc=document.getElementById('risk-bar-chart');
    if(rbc&&window.Chart)chartBar=new Chart(rbc,{type:'bar',data:{labels:sorted.map(r=>r.threat.length>20?r.threat.slice(0,18)+'…':r.threat),datasets:[{data:sorted.map(r=>r.score),backgroundColor:sorted.map(r=>colMap[r.level]),borderWidth:0,borderRadius:3}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`Risk score: ${ctx.parsed.x} / 25`}}},scales:{x:{max:25,grid:{color:gc},ticks:{color:tc,font:{size:11}}},y:{grid:{display:false},ticks:{color:tc,font:{size:11}}}}}});
    const rdc=document.getElementById('risk-donut-chart');
    if(rdc&&window.Chart)chartDonut=new Chart(rdc,{type:'doughnut',data:{labels:['Critical','High','Medium','Low'],datasets:[{data:[2,7,3,0],backgroundColor:['#E24B4A','#BA7517','#378ADD','#1D9E75'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false}}}});
  },0);
}

function renderKPI(){
  const on=METRICS.filter(m=>m.status==='on-track').length,ar=METRICS.filter(m=>m.status==='at-risk').length,of=METRICS.filter(m=>m.status==='off-track').length;
  const cards=METRICS.map(m=>{
    const fc=m.score>=90?'#1D9E75':m.score>=70?'#BA7517':'#E24B4A';
    const stB=m.status==='on-track'?'<span class="badge b-on">On track</span>':m.status==='at-risk'?'<span class="badge b-ar">At risk</span>':'<span class="badge b-of">Off track</span>';
    return`<div class="kpi-card"><div class="kpi-top"><div class="kpi-val">${m.current}</div>${stB}</div><div class="kpi-name">${m.name}</div><div class="kpi-target">Target: ${m.target}</div><div class="kpi-bar" style="height:6px"><div class="pfill" style="width:${m.score}%;background:${fc};height:100%"></div></div><div style="font-size:10px;color:var(--tt);margin-top:.375rem">${m.trendText}</div></div>`;
  }).join('');
  document.getElementById('sub-analytics-kpi').innerHTML=`<div class="sec-title">Security metrics — TechCorp Ltd</div><div class="sec-sub">Six core KPIs tracked quarterly and reported to executive leadership</div><div class="mgrid"><div class="mcard"><div class="mlb">KPIs tracked</div><div class="mvl">${METRICS.length}</div></div><div class="mcard"><div class="mlb">On track</div><div class="mvl ok">${on}</div></div><div class="mcard"><div class="mlb">At risk</div><div class="mvl hi">${ar}</div></div><div class="mcard"><div class="mlb">Off track</div><div class="mvl cr">${of}</div></div></div><div class="kpi-grid">${cards}</div><div style="border:0.5px solid var(--bd3);border-radius:var(--r8);padding:1rem;margin-top:1rem"><div style="font-size:12px;font-weight:500;color:var(--tp);margin-bottom:.5rem">Q1 2025 management commentary</div><div style="font-size:12px;color:var(--ts);line-height:1.7">MTTD and phishing click-through rate remain the two KPIs furthest from target. The SOC tuning exercise in Q2 is expected to reduce MTTD below 4 hours. Monthly phishing simulations will drive the click rate below 5% by Q3. Patch compliance improved +6pp vs Q4 2024 following the new automated pipeline. All P1 items from the ISO audit have been assigned owners with Q1 delivery commitments.</div></div>`;
}

function renderIR(){
  const sevCards=[['P1','Critical','Active breach, ransomware, data exfiltration','15 min','CISO + Legal + Exec + Insurance'],['P2','High','Unauthorized access, significant malware, partial outage','1 hour','CISO + IT Security Lead'],['P3','Medium','Suspicious activity, policy violation, minor impact','4 hours','IT Security Lead'],['P4','Low','Lost device, AUP violation, security query','24 hours','IT Security Team']].map(([p,l,c,r,e])=>`<div class="sev-card"><div class="sev-top"><span class="badge b-${p.toLowerCase()==='p1'?'c':p.toLowerCase()==='p2'?'h':p.toLowerCase()==='p3'?'m':'l'}">${p}</span><span style="font-size:12px;font-weight:500;color:var(--tp)">${l}</span></div><div class="sev-row"><strong>Criteria:</strong> ${c}</div><div class="sev-row"><strong>Response SLA:</strong> ${r}</div><div class="sev-row"><strong>Escalate to:</strong> ${e}</div></div>`).join('');
  const scenHTML=SCENARIOS.map(s=>{
    const isOpen=irOpen.has(s.id);
    const sevCls=s.sev==='P1'?'b-c':'b-h';
    return`<div class="scen"><div class="scen-hdr" onclick="toggleIR('${s.id}')"><i class="ti ${s.icon}" style="font-size:18px;color:var(--ts)"></i><div class="scen-title">${s.title}</div><span class="badge ${sevCls}">${s.sev}</span><i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:13px;color:var(--ts);margin-left:4px"></i></div>${isOpen?`<div class="scen-body open"><div class="scen-label">Indicators of compromise</div><ul class="scen-steps">${s.indicators.map(i=>`<li>${i}</li>`).join('')}</ul><div class="scen-label">Immediate actions — first 30 minutes</div><ul class="scen-steps">${s.immediate.map(i=>`<li>${i}</li>`).join('')}</ul><div class="scen-label">Containment</div><ul class="scen-steps">${s.contain.map(i=>`<li>${i}</li>`).join('')}</ul><div class="scen-label">Eradication</div><ul class="scen-steps">${s.eradicate.map(i=>`<li>${i}</li>`).join('')}</ul><div class="scen-label">Recovery</div><ul class="scen-steps">${s.recover.map(i=>`<li>${i}</li>`).join('')}</ul><div class="scen-label">Notification chain</div><div style="font-size:12px;color:var(--ts);line-height:1.6">${s.notify}</div></div>`:`<div class="scen-body"></div>`}</div>`;
  }).join('');
  document.getElementById('sub-ops-ir').innerHTML=`<div class="sec-title">Incident response playbook</div><div class="sec-sub">Step-by-step procedures for 4 scenarios — aligned to NIST SP 800-61r2 IR lifecycle</div><div class="sev-grid">${sevCards}</div><div style="font-size:13px;font-weight:500;color:var(--tp);margin-bottom:.75rem">IR process phases</div><div class="phases">${[['1','Identify','0–1 hr'],['2','Contain','1–4 hrs'],['3','Eradicate','4–24 hrs'],['4','Recover','24–72 hrs'],['5','Learn','Post-incident']].map(([n,nm,t])=>`<div class="phase"><div class="phase-num">${n}</div><div class="phase-name">${nm}</div><div class="phase-time">${t}</div></div>`).join('')}</div><div style="font-size:13px;font-weight:500;color:var(--tp);margin-bottom:.5rem">Scenario playbooks</div><div style="font-size:11px;color:var(--tt);margin-bottom:1rem">Click a scenario to expand the full step-by-step response procedure</div>${scenHTML}`;
}
function toggleIR(id){irOpen.has(id)?irOpen.delete(id):irOpen.add(id);renderIR()}

function renderTraining(){
  const mandatory=TRAINING.filter(t=>t.mandatory).length;const completed=TRAINING.filter(t=>t.completion!==null).length;
  const rows=TRAINING.map(t=>{
    const qCells=[1,2,3,4].map(q=>t.q.includes(q)?`<td style="text-align:center"><span class="${t.name.includes('Phishing')?'tc-q':'tc-active'}">${t.name.includes('Phishing')?'Sim':'Run'}</span></td>`:`<td style="text-align:center"><span class="tc-empty"></span></td>`).join('');
    const compCell=t.completion!==null?`<td><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;background:var(--bs);border-radius:3px;height:5px;overflow:hidden;min-width:50px"><div style="width:${t.completion}%;height:100%;border-radius:3px;background:${t.completion>=90?'#1D9E75':'#BA7517'}"></div></div><span style="font-size:11px;color:var(--ts)">${t.completion}%</span></div></td>`:`<td style="font-size:11px;color:var(--tt)">Q4 — upcoming</td>`;
    return`<tr><td style="font-weight:500;min-width:180px">${t.name}</td><td style="color:var(--ts);font-size:11px">${t.audience}</td><td style="color:var(--ts)">${t.duration}</td><td style="color:var(--ts)">${t.method}</td>${qCells}<td style="text-align:center">${t.mandatory?'<span class="badge b-c">Mandatory</span>':'<span class="badge b-na">Optional</span>'}</td>${compCell}</tr>`;
  }).join('');
  document.getElementById('sub-ops-train').innerHTML=`<div class="sec-title">Security awareness training program</div><div class="sec-sub">Annual training calendar — ISO 27001 A.7.2.2 and NIST SP 800-50 aligned — 2025 delivery plan</div><div class="mgrid"><div class="mcard"><div class="mlb">Total modules</div><div class="mvl">${TRAINING.length}</div></div><div class="mcard"><div class="mlb">Mandatory</div><div class="mvl cr">${mandatory}</div></div><div class="mcard"><div class="mlb">Completed (Q1–Q3)</div><div class="mvl ok">${completed}</div></div><div class="mcard"><div class="mlb">Phishing sims / yr</div><div class="mvl">4</div></div></div><div class="twrap"><table><thead><tr><th>Training module</th><th>Audience</th><th>Duration</th><th>Delivery</th><th style="text-align:center">Q1</th><th style="text-align:center">Q2</th><th style="text-align:center">Q3</th><th style="text-align:center">Q4</th><th>Type</th><th style="min-width:120px">Completion</th></tr></thead><tbody>${rows}</tbody></table></div><div style="border:0.5px solid var(--bd3);border-radius:var(--r6);padding:1rem;margin-top:1.25rem"><div style="font-size:12px;font-weight:500;color:var(--tp);margin-bottom:.5rem">Phishing simulation results — 2025</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">${[['Q1','8.3%','#BA7517'],['Q2','6.1%','#BA7517'],['Q3','5.4%','#BA7517'],['Q4','Pending','var(--tt)']].map(([q,v,c])=>`<div style="background:var(--bs);border-radius:var(--r6);padding:10px"><div style="font-size:10px;color:var(--tt);margin-bottom:3px">${q} simulation</div><div style="font-size:18px;font-weight:500;color:${c}">${v}</div><div style="font-size:11px;color:var(--ts)">click rate</div></div>`).join('')}</div><div style="font-size:11px;color:var(--tt);margin-top:.75rem">Target: &lt; 5% click-through rate. Trend improving quarter-over-quarter.</div></div>`;
}

function renderVRA(){
  const cats=[...new Set(VRA_Q.map(q=>q.cat))];
  const catHTML=cats.map(cat=>{
    const qs=VRA_Q.filter(q=>q.cat===cat);
    return`<div class="vra-cat">${cat}</div>${qs.map(q=>`<div class="vra-row"><div class="vra-q">${q.q}</div><div class="vra-btns"><button id="vra-${q.id}-yes" class="vra-btn" onclick="setVRA('${q.id}','yes')">Yes</button><button id="vra-${q.id}-partial" class="vra-btn" onclick="setVRA('${q.id}','partial')">Partial</button><button id="vra-${q.id}-no" class="vra-btn" onclick="setVRA('${q.id}','no')">No</button><button id="vra-${q.id}-na" class="vra-btn" onclick="setVRA('${q.id}','na')">N/A</button></div></div>`).join('')}`;
  }).join('');
  document.getElementById('sub-ops-vra').innerHTML=`<div class="sec-title">Vendor risk assessment questionnaire</div><div class="sec-sub">${VRA_Q.length}-question security assessment across 6 domains — click Yes/Partial/No/N/A to generate a live risk rating</div><div class="vra-score-box"><div><div id="vra-score" style="font-size:36px;font-weight:500;color:var(--tp)">—</div><div id="vra-rating" style="font-size:14px;font-weight:500;color:var(--ts);margin-bottom:3px">Answer questions to generate a risk rating</div><div id="vra-answered" style="font-size:11px;color:var(--ts)">0 / ${VRA_Q.length} questions answered</div></div><div style="flex:1;min-width:160px"><div style="font-size:11px;color:var(--ts);margin-bottom:5px">Vendor security score</div><div class="ptrack" style="height:12px"><div class="pfill" id="vra-bar" style="width:0%;background:#1D9E75;height:100%"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--tt);margin-top:3px"><span>Critical</span><span>High</span><span>Medium</span><span>Low risk</span></div><div style="font-size:11px;color:var(--tt);margin-top:.625rem">≥90% Low · 70–89% Medium · 50–69% High · &lt;50% Critical risk</div></div></div><div style="font-size:11px;color:var(--tt);margin-bottom:1rem">Scoring: Yes = 4 pts · Partial = 2 pts · No = 0 pts · N/A = excluded from calculation</div>${catHTML}`;
}
function setVRA(id,val){
  vraAnswers[id]=val;
  ['yes','partial','no','na'].forEach(v=>{const btn=document.getElementById(`vra-${id}-${v}`);if(!btn)return;btn.className='vra-btn';if(v===val)btn.classList.add(v==='yes'?'yes-on':v==='partial'?'part-on':v==='no'?'no-on':'na-on');});
  let total=0,score=0,answered=0;
  VRA_Q.forEach(q=>{const a=vraAnswers[q.id];if(a&&a!=='na'){total+=4;score+=(a==='yes'?4:a==='partial'?2:0);answered++;}else if(a==='na')answered++;});
  const pct=total>0?Math.round((score/total)*100):0;
  const fc=pct>=90?'#1D9E75':pct>=70?'#BA7517':'#E24B4A';
  const rating=pct>=90?'Low risk — strong security posture':pct>=70?'Medium risk — some gaps; request remediation plan':pct>=50?'High risk — significant gaps; enhanced due diligence required':'Critical risk — do not onboard without major remediation';
  const sv=document.getElementById('vra-score'),sr=document.getElementById('vra-rating'),sb=document.getElementById('vra-bar'),sa=document.getElementById('vra-answered');
  if(sv)sv.textContent=total>0?pct+'%':'—';
  if(sr){sr.textContent=total>0?rating:'Answer questions to generate a risk rating';sr.style.color=total>0?fc:'var(--ts)';}
  if(sb){sb.style.width=pct+'%';sb.style.background=fc;}
  if(sa)sa.textContent=`${answered} / ${VRA_Q.length} questions answered`;
}

function renderReport(){
  const d=REPORT[reportOrg];const fc=pfc(d.compliance);
  const domLabels=['A.5','A.6','A.7','A.8','A.9','A.10','A.11','A.12','A.13','A.14','A.15','A.16','A.17','A.18'];
  const hmCells=d.domScores.map(s=>`<div class="hm-cell ${s>=80?'hm-ok':s>=50?'hm-pt':'hm-ni'}">${s}%</div>`).join('');
  document.getElementById('sub-report-main').innerHTML=`<div class="sec-title">GRC audit report — ${d.name}</div><div class="sec-sub">Formal assessment covering risk register, ISO 27001 compliance, and governance readiness — Q1 2025</div><div class="orgrow"><label>Organization:</label><select onchange="switchRptOrg(this.value)"><option value="techcorp"${reportOrg==='techcorp'?' selected':''}>TechCorp Ltd</option><option value="health"${reportOrg==='health'?' selected':''}>HealthFirst Inc</option></select></div><div class="rpt-section"><div class="rpt-h"><i class="ti ti-info-circle"></i>Report metadata</div><div class="rpt-meta">${[['Organization',d.name],['Industry',d.industry],['Headcount',d.employees],['Assessment period','Q1 2025'],['Framework','ISO 27001:2013'],['Lead assessor','Information Security Team'],['Status','Draft — for management review'],['Next review','Q4 2025']].map(([k,v])=>`<div style="background:var(--bs);border-radius:var(--r6);padding:8px 10px"><div class="rpt-mk">${k}</div><div class="rpt-mv">${v}</div></div>`).join('')}</div></div><div class="rpt-section"><div class="rpt-h"><i class="ti ti-align-left"></i>Executive summary</div><div class="rpt-p">This GRC assessment evaluated ${d.name} across three dimensions: (1) threat risk identification and scoring using a 5×5 likelihood × impact methodology, (2) ISO/IEC 27001:2013 compliance across all 14 Annex A domains, and (3) governance framework alignment including policies, RACI, and roadmap.</div><div class="rpt-p">The risk register identified 12 cyber threats — <strong style="font-weight:500">${d.compliance>=70?2:2} Critical</strong> and 7 High. ISO 27001 compliance: <strong style="font-weight:500;color:${fc}">${d.compliance}%</strong> — ${d.implemented} implemented, ${d.partial} partial, ${d.notImpl} not implemented.</div></div><div class="rpt-section"><div class="rpt-h"><i class="ti ti-table"></i>Compliance heat map — all 14 Annex A domains</div><div style="font-size:11px;color:var(--ts);margin-bottom:.5rem"><span class="badge b-ok" style="font-size:10px">≥80%</span> <span class="badge b-pt" style="font-size:10px">50–79%</span> <span class="badge b-nc" style="font-size:10px">&lt;50%</span></div><div class="hm-grid">${domLabels.map(l=>`<div class="hm-lbl">${l}</div>`).join('')}${hmCells}</div></div><div class="rpt-section"><div class="rpt-h"><i class="ti ti-alert-circle"></i>Key findings</div><ul class="find-list">${d.findings.map(f=>`<li>${f}</li>`).join('')}</ul></div><div class="rpt-section"><div class="rpt-h"><i class="ti ti-list-check"></i>Prioritized recommendations</div>${d.recs.map(r=>`<div class="rec-item"><span class="badge ${r.p==='P1'?'b-c':r.p==='P2'?'b-h':'b-m'}">${r.p}</span><span style="font-size:12px;color:var(--tp);line-height:1.5">${r.t}</span></div>`).join('')}</div><div class="rpt-section"><div class="rpt-h"><i class="ti ti-flag"></i>Conclusion</div><div class="rpt-p">${d.conclusion}</div></div>`;
}
function switchRptOrg(v){reportOrg=v;renderReport()}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function switchTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  btn.classList.add('on');
}

function switchSub(panelId,subId,btn){
  const panel=document.getElementById('panel-'+panelId);
  panel.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('on'));
  panel.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('sub-'+panelId+'-'+subId).classList.add('on');
  btn.classList.add('on');
  // Lazy render
  if(panelId==='risk'&&subId==='treat'&&!rendered.treat){renderTreatment();rendered.treat=true;}
  if(panelId==='audit'&&subId==='ext'&&!rendered.ext){renderExtDomains();rendered.ext=true;}
  if(panelId==='audit'&&subId==='soa'&&!rendered.soa){renderSoA();rendered.soa=true;}
  if(panelId==='audit'&&subId==='gap'&&!rendered.gap){renderGapAnalysis();rendered.gap=true;}
  if(panelId==='gov'&&subId==='policy'&&!rendered.gov){renderPolicies();rendered.gov=true;}
  if(panelId==='analytics'&&subId==='charts'&&!rendered.charts){renderRiskAnalytics();rendered.charts=true;}
  if(panelId==='analytics'&&subId==='kpi'&&!rendered.kpi){renderKPI();rendered.kpi=true;}
  if(panelId==='ops'&&subId==='train'&&!rendered.train){renderTraining();rendered.train=true;}
  if(panelId==='ops'&&subId==='vra'&&!rendered.vra){renderVRA();rendered.vra=true;}
}

// Override tab switching to lazy-render analytics dashboard
const origSwitchTab=switchTab;
window.switchTab=function(id,btn){
  origSwitchTab(id,btn);
  if(id==='analytics'&&!rendered.dash){renderDashboard();rendered.dash=true;}
  if(id==='ops'&&!rendered.ir){renderIR();rendered.ir=true;}
  if(id==='report'&&!rendered.report){renderReport();rendered.report=true;}
};

// ═══════════════════════════════════════════════════════════════
// INIT — render default panels
// ═══════════════════════════════════════════════════════════════
renderRisk();
renderSlide();
renderAuditMain();
renderGapAnalysis();rendered.gap=true;
</script>
